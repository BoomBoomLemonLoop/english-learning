<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="英语精读与 TTS 跟练网页合集。">
  <meta name="color-scheme" content="light">
  <title>英语学习小站｜精读与 TTS 跟练</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231c3d5a'/%3E%3Cpath d='M18 43V18h15c8 0 13 4 13 10 0 4-2 7-6 8 5 1 7 4 7 8 0 2-.5 4-1.5 5H35c1-1 1.5-2 1.5-4 0-3-2-5-6-5h-3v9H18zm9-15h5c3 0 4-1 4-3s-1-3-4-3h-5v6z' fill='%23ffd166'/%3E%3C/svg%3E">
  <style>
    :root {
      --navy: #18364d;
      --navy-deep: #10283a;
      --lemon: #ffd166;
      --lemon-soft: #fff5cc;
      --paper: #f6f8fb;
      --card: #ffffff;
      --ink: #17212b;
      --muted: #647383;
      --line: #dce3e9;
      --shadow: 0 18px 45px rgba(19, 48, 69, .09);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--paper);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.6;
    }
    a { color: inherit; }
    .topbar {
      color: white;
      background:
        radial-gradient(circle at 86% 15%, rgba(255, 209, 102, .2), transparent 20rem),
        linear-gradient(135deg, var(--navy-deep), var(--navy));
    }
    .topbar-inner, main, footer {
      width: min(1080px, calc(100% - 32px));
      margin: auto;
    }
    .topbar-inner { padding: 46px 0 42px; }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      font-size: .92rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 10px;
      color: var(--navy-deep);
      background: var(--lemon);
      font: 800 18px/1 Georgia, serif;
    }
    h1 {
      max-width: 760px;
      margin: 0;
      font-size: clamp(2rem, 6vw, 4.2rem);
      line-height: 1.08;
      letter-spacing: -.035em;
    }
    .intro {
      max-width: 650px;
      margin: 18px 0 0;
      color: #d8e3eb;
      font-size: 1.05rem;
    }
    main { padding: 32px 0 64px; }
    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 26px;
    }
    .search-wrap { position: relative; flex: 1; }
    .search-icon {
      position: absolute;
      top: 50%;
      left: 16px;
      width: 19px;
      height: 19px;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }
    #search {
      width: 100%;
      min-height: 50px;
      padding: 12px 16px 12px 46px;
      border: 1px solid var(--line);
      border-radius: 14px;
      outline: none;
      background: var(--card);
      color: var(--ink);
      font: inherit;
      box-shadow: 0 6px 20px rgba(19, 48, 69, .04);
    }
    #search:focus {
      border-color: var(--navy);
      box-shadow: 0 0 0 4px rgba(24, 54, 77, .11);
    }
    .count { color: var(--muted); white-space: nowrap; }
    .lesson-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 310px), 1fr));
      gap: 20px;
    }
    .lesson-card {
      display: flex;
      min-height: 260px;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--card);
      box-shadow: var(--shadow);
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .lesson-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 22px 52px rgba(19, 48, 69, .14);
    }
    .card-accent {
      height: 7px;
      background: linear-gradient(90deg, var(--lemon), #ffac41);
    }
    .card-body {
      display: flex;
      flex: 1;
      flex-direction: column;
      padding: 24px;
    }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag {
      padding: 4px 9px;
      border-radius: 999px;
      color: #6c5100;
      background: var(--lemon-soft);
      font-size: .78rem;
      font-weight: 700;
    }
    h2 { margin: 18px 0 9px; font-size: 1.35rem; line-height: 1.35; }
    .description { margin: 0; color: var(--muted); }
    .open-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      align-self: flex-start;
      margin-top: auto;
      padding-top: 24px;
      color: var(--navy);
      font-weight: 750;
      text-decoration: none;
    }
    .open-link::after { content: "→"; transition: transform .18s ease; }
    .lesson-card:hover .open-link::after { transform: translateX(4px); }
    .empty-state {
      display: none;
      padding: 52px 20px;
      border: 1px dashed #b8c5cf;
      border-radius: 18px;
      color: var(--muted);
      text-align: center;
      background: rgba(255, 255, 255, .65);
    }
    footer {
      padding-bottom: 36px;
      color: var(--muted);
      font-size: .88rem;
      text-align: center;
    }
    @media (max-width: 560px) {
      .topbar-inner { padding: 32px 0 34px; }
      .brand { margin-bottom: 22px; }
      .controls { align-items: stretch; flex-direction: column; gap: 8px; }
      .count { padding-left: 3px; }
      main { padding-top: 24px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><span class="brand-mark" aria-hidden="true">E</span> English Learning</div>
      <h1>英语学习小站</h1>
      <p class="intro">集中整理英语原文、生词、实用词块与逐句朗读页面。选择一篇内容，随时开始精读和跟练。</p>
    </div>
  </header>

  <main>
    <div class="controls">
      <label class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path>
        </svg>
        <span hidden>搜索学习页面</span>
        <input id="search" type="search" placeholder="搜索标题、主题或标签……" autocomplete="off">
      </label>
      <div class="count" id="count" aria-live="polite">共 1 篇</div>
    </div>

    <section class="lesson-grid" id="lessonGrid" aria-label="学习页面列表">
      <article class="lesson-card" data-search="labubu 拉布布 潮流玩具 商业 市场 热度 tts 英语精读">
        <div class="card-accent"></div>
        <div class="card-body">
          <div class="tags"><span class="tag">英语精读</span><span class="tag">TTS 跟练</span></div>
          <h2>Labubu：从爆红到降温</h2>
          <p class="description">逐句中英对照、生词语境解析、词块学习和浏览器语音跟练。</p>
          <a class="open-link" href="labubu-tts-practice.html">开始学习</a>
        </div>
      </article>
    </section>

    <div class="empty-state" id="emptyState">没有找到匹配的学习页面，请换一个关键词。</div>
  </main>

  <footer>个人英语学习资料库 · 页面语音由浏览器提供</footer>

  <script>
    const searchInput = document.getElementById('search');
    const cards = [...document.querySelectorAll('.lesson-card')];
    const count = document.getElementById('count');
    const emptyState = document.getElementById('emptyState');

    function filterLessons() {
      const query = searchInput.value.trim().toLocaleLowerCase();
      let visibleCount = 0;

      cards.forEach((card) => {
        const searchableText = `${card.textContent} ${card.dataset.search}`.toLocaleLowerCase();
        const isVisible = !query || searchableText.includes(query);
        card.hidden = !isVisible;
        visibleCount += Number(isVisible);
      });

      count.textContent = query ? `找到 ${visibleCount} 篇` : `共 ${cards.length} 篇`;
      emptyState.style.display = visibleCount ? 'none' : 'block';
    }

    searchInput.addEventListener('input', filterLessons);
  </script>
</body>
</html>
